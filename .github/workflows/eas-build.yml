name: Expo EAS Mobile Build & Deploy

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview | production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Target Platform (android | ios | all)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  eas-build:
    name: EAS Build (${{ inputs.platform || 'android' }} - ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run EAS Build
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform || 'android' }} --profile ${{ inputs.profile || 'preview' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
