name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview | production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/eas-build.yml'
    branches:
      - build-apk

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup EAS CLI & Local Build Plugin
        run: npm install -g pnpm@9 eas-cli eas-cli-local-build-plugin

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Dependencies
        run: |
          pnpm --filter @chat/shared-config build
          pnpm --filter @chat/shared-contracts build

      - name: Build APK Locally on Runner
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --local --output=./chat-app-preview.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-preview-apk
          path: apps/mobile/chat-app-preview.apk
          if-no-files-found: error
