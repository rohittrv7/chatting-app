name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview | production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/eas-build.yml'
    branches:
      - build-apk
      - develop

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup EAS CLI & Local Build Plugin
        run: npm install -g pnpm@9 eas-cli eas-cli-local-build-plugin

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch Hermes TextDecoder Compatibility
        run: node scripts/patch-hermes-textdecoder.js

      - name: Build Monorepo Dependencies
        run: |
          pnpm --filter @chat/shared-config build
          pnpm --filter @chat/shared-contracts build

      - name: Inject Google OAuth Secrets into Build Environment
        working-directory: apps/mobile
        run: |
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB=${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID=${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID }}" >> .env

      - name: Build APK Locally on Runner
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --local --output=./chat-app-preview.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID }}

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-preview-apk
          path: apps/mobile/chat-app-preview.apk
          if-no-files-found: error

      - name: Create Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: preview-apk-build-${{ github.run_number }}
          name: WhatsApp Connect APK (Build #${{ github.run_number }})
          files: apps/mobile/chat-app-preview.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
