name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test-backend:
    name: Lint, Build & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat_user
          POSTGRES_PASSWORD: chat_password
          POSTGRES_DB: chatting_system_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Shared Packages
        run: pnpm --filter ./packages/* build

      - name: Lint Backend
        run: pnpm --filter ./apps/backend lint || true

      - name: Generate Prisma Client & Migrate
        run: |
          cd apps/backend
          npx prisma generate
          npx prisma migrate deploy || true

      - name: Run Backend Unit Tests
        run: pnpm --filter ./apps/backend test

  flutter-lint-and-analyze:
    name: Flutter Lint & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run Flutter Analyze
        run: |
          cd apps/mobile
          flutter analyze
