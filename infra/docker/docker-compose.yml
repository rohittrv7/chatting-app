version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_postgres
    restart: always
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
      POSTGRES_DB: chatting_system_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat_user -d chatting_system_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.2-r0
    container_name: chat_coturn
    restart: always
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '5349:5349/udp'
      - '5349:5349/tcp'
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: chat_backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: 'postgresql://chat_user:chat_password@postgres:5432/chatting_system_db?schema=public'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-chatting-media}
      B2_REGION: ${B2_REGION:-us-east-005}
      B2_ENDPOINT: ${B2_ENDPOINT:-s3.us-east-005.backblazeb2.com}
      B2_KEY_ID: ${B2_KEY_ID}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY}
      COTURN_SECRET: coturn_super_secret_auth_key
      JWT_SECRET: super_secret_jwt_access_key_12345
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_12345
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
